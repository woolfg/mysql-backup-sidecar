name: DockerHub
on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: woolfg/mysql-backup-sidecar

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install unit test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip
      - name: Shell syntax and backup regression tests
        run: |
          for script in scripts/*.sh modules/*.sh build/*.sh tests/integration.sh; do bash -n "$script"; done
          python3 -m unittest discover -s tests -p 'test_*.py'

  build:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: mysql
            version: "8.4"
          - family: mysql
            version: "9.7"
          - family: mariadb
            version: "10.11"
          - family: mariadb
            version: "11.4"
          - family: mariadb
            version: "11.8"
          - family: mariadb
            version: "12.3"
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: suffix=-${{ matrix.family }}-${{ matrix.version }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.family }}/${{ matrix.version }}/Dockerfile
          platforms: linux/amd64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          load: true
          tags: sidecar-test:${{ matrix.family }}-${{ matrix.version }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify ZIP uploads, downloads and database restores
        run: bash tests/integration.sh '${{ matrix.family }}' '${{ matrix.version }}' 'sidecar-test:${{ matrix.family }}-${{ matrix.version }}'

      - name: Login to DockerHub
        if: github.event_name != 'pull_request' && github.repository == 'woolfg/mysql-backup-sidecar'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Tag the exact image that passed restore verification, then publish it.
      - name: Push verified image
        if: github.event_name != 'pull_request' && github.repository == 'woolfg/mysql-backup-sidecar'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          TEST_IMAGE: sidecar-test:${{ matrix.family }}-${{ matrix.version }}
        run: |
          while IFS= read -r tag; do
            docker tag "$TEST_IMAGE" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: Update DockerHub description
        if: github.event_name != 'pull_request' && github.repository == 'woolfg/mysql-backup-sidecar' && matrix.family == 'mysql' && matrix.version == '8.4'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: README.md
